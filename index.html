<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Demandas</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- SortableJS para Kanban -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <!-- FullCalendar -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">
    
    <!-- Estilo Principal -->
    <link rel="stylesheet" href="assets/css/style.css?v=9">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <!-- Tela de Login -->
    <div id="login-screen" class="login-screen active">
        <div class="login-box">
            <img src="assets/img/logo.png" alt="Logo" class="login-logo" onerror="this.src='https://via.placeholder.com/150x50?text=LOGO'">
            <h2>Acesso Restrito</h2>
            <form id="formLogin" onsubmit="event.preventDefault(); app.doLogin();">
                <div class="form-group">
                    <label>E-mail</label>
					<input type="email" id="login_user" class="form-control" placeholder="@" required>
                    <!-- <input type="email" id="login_user" class="form-control" placeholder="admin@admin.com" required> -->
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login_pass" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Entrar</button>
            </form>
            
            <div style="text-align: center; margin: 15px 0; color: var(--text-muted); font-size: 0.9rem;">ou</div>
            
            <button type="button" class="btn btn-secondary" style="width: 100%; justify-content: center; background: #fff; color: #333; border: 1px solid #ccc;" onclick="app.doLoginGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G" style="width: 18px; margin-right: 10px;"> Entrar com o Google
            </button>

            <div id="login_error" class="login-error"></div>
            
<!--             <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
                <button class="btn btn-secondary btn-sm" onclick="app.setupFirebaseBase()" style="width: 100%; justify-content: center;">Criar Banco de Dados e Admin Inicial</button>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 5px;">*Use apenas na primeira vez após configurar o FirebaseConfig no código.</p>
            </div> -->
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" style="display: none; width: 100%; height: 100%;">
        <!-- Sidebar Lateral -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="assets/img/logo.png" alt="Logo" class="logo-img" style="max-height: 40px;" onerror="this.style.display='none'">
                    <div>
                        <h2>Gestão de Demandas</h2>
                        <span>CRE Manacapuru</span>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">PRINCIPAL</div>
                <ul id="main-menu">
                    <li class="active" data-view="dashboard"><i class="ri-dashboard-line"></i> Dashboard</li>
                    <li onclick="app.openModalDemanda()"><i class="ri-add-line"></i> Nova Demanda</li>
                    <li data-view="demandas"><i class="ri-file-list-3-line"></i> Demandas</li>
                    <li data-view="kanban"><i class="ri-layout-column-line"></i> Kanban</li>
                    <li data-view="calendario"><i class="ri-calendar-line"></i> Calendário</li>
                </ul>
                
                <div class="nav-section">CADASTROS</div>
                <ul id="config-menu">
                    <li data-view="cadastros"><i class="ri-settings-4-line"></i> Tabelas Base</li>
                    <li id="menu-usuarios" style="display:none;" data-view="usuarios"><i class="ri-user-settings-line"></i> Usuários</li>
                    <li data-view="contatos"><i class="ri-contacts-book-line"></i> Agenda de Contatos</li>
                    <li id="menu-agenda-demandas" style="display:none;" data-view="agenda_demandas"><i class="ri-calendar-todo-line"></i> Agenda de Demandas</li>
                    <li data-view="sugestoes"><i class="ri-lightbulb-line"></i> Sugestões</li>
                    <li data-view="creditos"><i class="ri-info-card-line"></i> Créditos</li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <img src="assets/img/brasao.png" alt="Brasão" class="brasao-img" onerror="this.src='https://via.placeholder.com/80x80?text=BRASÃO'">
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left" style="display:flex; align-items:center; gap: 15px;">
                    <button class="btn btn-sm btn-secondary" onclick="app.toggleSidebar()"><i class="ri-menu-line"></i></button>
                    <button class="btn btn-sm btn-secondary btn-refresh" id="btnRefreshView" onclick="app.refreshView()" title="Atualizar página atual"><i class="ri-refresh-line"></i> Atualizar</button>
                    <h1 id="page-title">Dashboard</h1>
                </div>
                <div class="topbar-right">
                    <div class="clock" id="clockDisplay">--:--</div>
                    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="app.toggleTheme()" title="Alternar Modo Dark/Light">
                        <i class="ri-moon-line" id="themeToggleIcon"></i>
                    </button>
                    <div class="user-profile">
                        <div class="avatar" id="user-avatar-initial">A</div>
                        <span id="user-name-display">Admin</span>
                        <button class="btn btn-sm btn-primary" onclick="app.abrirModalTrocarSenha(false)" style="margin-left: 10px;"><i class="ri-lock-password-line"></i> Alterar Senha</button>
                        <button class="btn btn-sm btn-secondary" onclick="app.doLogout()" style="margin-left: 10px;"><i class="ri-logout-box-r-line"></i> Sair</button>
                    </div>
                </div>
            </header>

            <div class="content-area" id="contentArea">
                <!-- As views serão injetadas aqui via JS -->
            </div>
        </main>
    </div>

    <!-- Templates de Views (Escondidos) -->
    
    <!-- View: Dashboard -->
    <template id="view-dashboard">
        <div class="dashboard-header-title">
            <div class="logo-box"><i class="ri-book-read-fill"></i></div>
            <div class="title-text">
                <h2>Gestão de Demandas</h2>
                <p>Coordenadoria Regional de Educação — Manacapuru</p>
            </div>
        </div>

        <!-- Filtro de Coordenação -->
        <div class="dashboard-coord-filter">
            <div class="coord-filter-label"><i class="ri-filter-3-line"></i> Exibir por Coordenação:</div>
            <div class="coord-filter-tabs" id="coordFilterTabs">
                <button class="coord-tab active" data-coord="TODAS"><i class="ri-global-line"></i> Todas</button>
                <button class="coord-tab" data-coord="PEDAGÓGICA ADJUNTA"><i class="ri-book-open-line"></i> Pedagógica Adjunta</button>
                <button class="coord-tab" data-coord="ADMINISTRATIVA ADJUNTA"><i class="ri-building-4-line"></i> Administrativa Adjunta</button>
            </div>
        </div>

        <div class="dashboard-kpis" id="dashboard-kpis-container">
            <!-- KPI cards gerados dinamicamente via JS -->
        </div>

        <!-- Dois gráficos na parte inferior -->
        <div class="dashboard-charts-row">
            <!-- Gráfico 2: Selecionável (Barra Horizontal) — ESQUERDA / MAIOR -->
            <div class="chart-container chart-panel-bar">
                <div class="chart-panel-header">
                    <div class="chart-title-wrap">
                        <div class="chart-icon-badge" id="barChartIconBadge"><i class="ri-bar-chart-horizontal-line"></i></div>
                        <h3 id="barChartTitle">Por Setor</h3>
                    </div>
                    <div class="chart-controls">
                        <select id="barChartSelector" class="chart-selector">
                            <option value="setor">Por Setor</option>
                            <option value="tipo">Por Tipo</option>
                            <option value="responsavel">Por Responsável</option>
                            <option value="escola">Por Escola</option>
                        </select>
                    </div>
                </div>
                <div class="chart-body chart-body-panel">
                    <canvas id="chartBarCanvas"></canvas>
                </div>
            </div>

            <!-- Gráfico 1: Demandas por Status (Rosca) — DIREITA / MENOR -->
            <div class="chart-container chart-panel-donut">
                <div class="chart-panel-header">
                    <div class="chart-title-wrap">
                        <div class="chart-icon-badge"><i class="ri-pie-chart-2-line"></i></div>
                        <h3>Demandas por Status</h3>
                    </div>
                </div>
                <div class="chart-body chart-body-panel">
                    <canvas id="chartStatusCanvas"></canvas>
                </div>
            </div>
        </div>
    </template>

    <!-- View: Demandas (Lista) -->
    <template id="view-demandas">
        <div class="toolbar">
            <button class="btn btn-primary" onclick="app.openModalDemanda()"><i class="ri-add-line"></i> Nova Demanda</button>
            <button class="btn btn-secondary" onclick="app.openModalImportar()"><i class="ri-file-excel-line"></i> Importar Colar (Excel)</button>
            <button class="btn btn-secondary" onclick="app.exportExcel()"><i class="ri-file-excel-line"></i> Relatório Excel</button>
            <button class="btn btn-secondary" onclick="app.exportarRelatorioPDF()"><i class="ri-file-pdf-line"></i> Relatório PDF</button>
            <button class="btn btn-danger" onclick="app.renumerarTudo()" title="Renumerar as demandas existentes do 0001 em diante" style="margin-left:auto;"><i class="ri-list-ordered-2"></i> Renumerar Tudo</button>
            <button class="btn btn-danger" onclick="app.resetarContadorDemandas()" title="Zerar a numeração para iniciar do 0001"><i class="ri-refresh-line"></i> Resetar Novo</button>
        </div>
        <div class="toolbar" style="margin-bottom:10px; align-items:center; flex-wrap:wrap; gap:10px;">
            <div class="filters" style="flex:1; min-width:0; flex-wrap:wrap;">
                <input type="text" id="filter-search" placeholder="Buscar...">
                <select id="filter-order" onchange="app.carregarDemandas()">
                    <option value="desc">Data de Criação (Decrescente)</option>
                    <option value="asc">Data de Criação (Crescente)</option>
                </select>
                <div style="display: flex; gap: 5px; align-items: center;">
                    <label style="font-size: 12px; color: var(--text-muted);">Período:</label>
                    <input type="date" id="filter-data-inicio" title="Data Inicial" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border);">
                    <input type="date" id="filter-data-fim" title="Data Final" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border);">
                </div>
                <select id="filter-coordenadoria"><option value="">Todas Coordenações</option></select>
                <select id="filter-escola"><option value="">Todas Escolas</option></select>
                <select id="filter-tipo"><option value="">Todos Tipos</option></select>
                <select id="filter-status"><option value="">Todos Status</option></select>
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
                <button id="filter-arquivadas" class="btn btn-sm filter-toggle" data-active="false" onclick="app.toggleFilterBtn('filter-arquivadas', () => { if(document.getElementById('filter-arquivadas').getAttribute('data-active') === 'true') { document.getElementById('filter-lixeira').setAttribute('data-active', 'false'); document.getElementById('filter-lixeira').classList.remove('active'); } app.carregarDemandas(); })"><i class="ri-archive-line"></i> Arquivadas</button>
                <button id="filter-lixeira" class="btn btn-sm filter-toggle" data-active="false" onclick="app.toggleFilterBtn('filter-lixeira', () => { if(document.getElementById('filter-lixeira').getAttribute('data-active') === 'true') { document.getElementById('filter-arquivadas').setAttribute('data-active', 'false'); document.getElementById('filter-arquivadas').classList.remove('active'); } app.carregarDemandas(); })"><i class="ri-delete-bin-line"></i> Lixeira</button>
                <button id="filter-com-processo" class="btn btn-sm filter-toggle" data-active="false" onclick="app.toggleFilterBtn('filter-com-processo', () => app.filtrarTabelaDemandas())"><i class="ri-file-text-line"></i> Com SIGED</button>
                <div class="column-selector-dropdown">
                    <button class="btn btn-sm btn-secondary" onclick="app.toggleColumnSelector()"><i class="ri-layout-column-line"></i> Colunas</button>
                    <div id="column-selector-menu" class="column-selector-menu" style="display: none;">
                        <!-- Checkboxes injetados via JS -->
                    </div>
                </div>
                <button class="btn btn-sm btn-secondary" onclick="app.exportExcel()"><i class="ri-file-excel-line"></i> Exportar</button>
            </div>
        </div>
        
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr id="demandas-thead-tr">
                        <!-- Injetado dinamicamente via JS -->
                    </tr>
                </thead>
                <tbody id="demandas-tbody">
                    <!-- Linhas injetadas via JS -->
                </tbody>
            </table>
        </div>
        <div id="pagination-controls" class="pagination" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: var(--surface); padding: 10px 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
            <div>
                <span>Mostrar </span>
                <select id="items-per-page" style="padding: 5px; border-radius: 4px; border: 1px solid var(--border);" onchange="app.changeItemsPerPage(this.value)">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <span> registros por página</span>
            </div>
            <div style="display: flex; gap: 5px; align-items: center;" id="pagination-buttons">
                <!-- Buttons injetados via JS -->
            </div>
        </div>
    </template>

    <!-- View: Detalhes da Demanda (Página Cheia) -->
    <template id="view-demanda-detalhe">
        <div class="demanda-detalhe-container">
            <div class="demanda-detalhe-header">
                <button class="btn btn-voltar" onclick="app.voltarDemandas()"><i class="ri-arrow-left-line"></i> Voltar</button>
                <div class="demanda-detalhe-actions" id="detalhe-actions">
                    <!-- Botões injetados via JS -->
                </div>
            </div>

            <!-- Card Superior: Dados Estáticos -->
            <div class="card detalhe-card">
                <div class="detalhe-badge-row">
                    <span class="badge" style="background:#e2e8f0; color:#333; font-weight:600;" id="detalhe-numero">-</span>
                    <span class="badge" id="detalhe-status">-</span>
                </div>
                <h2 class="detalhe-titulo" id="detalhe-descricao">-</h2>
                
                <div class="detalhe-grid">
                    <div class="detalhe-item">
                        <label>Data do Registro</label>
                        <span id="detalhe-data">-</span>
                    </div>
                    <div class="detalhe-item">
                        <label>Processo SIGED</label>
                        <span id="detalhe-processo">-</span>
                    </div>
                    <div class="detalhe-item">
                        <label>Tipo de Demanda</label>
                        <span id="detalhe-tipo">-</span>
                    </div>
                    <div class="detalhe-item">
                        <label>Demandante</label>
                        <span id="detalhe-demandante">-</span>
                    </div>
                    <div class="detalhe-item">
                        <label>Escola Demandante</label>
                        <span id="detalhe-escola">-</span>
                    </div>
                    <div class="detalhe-item">
                        <label>Servidor Responsável</label>
                        <span id="detalhe-responsavel">-</span>
                    </div>
                </div>
            </div>

            <!-- Card Inferior: Registro de Ações -->
            <div class="card detalhe-card detalhe-acoes-card">
                <div class="acoes-header">
                    <h3><i class="ri-file-list-3-line"></i> Registro de Ações</h3>
                    <button class="btn btn-primary" onclick="app.abrirFormNovaAcao()"><i class="ri-add-line"></i> Nova Ação</button>
                </div>

                <!-- Formulário de Nova Ação (Oculto por padrão) -->
                <div class="acoes-form-container" id="detalhe-acao-form-container" style="display: none;">
                    <form id="detalhe-acao-form" onsubmit="event.preventDefault(); app.salvarAcaoDetalhe();">
                        <input type="hidden" id="detalhe-acao-id">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Data *</label>
                                <input type="date" id="detalhe-acao-data" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Servidor Responsável</label>
                                <select id="detalhe-acao-responsavel" class="form-control">
                                    <option value="">Selecione</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Descrição da Ação *</label>
                            <textarea id="detalhe-acao-descricao" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Status da Demanda *</label>
                            <select id="detalhe-acao-status" class="form-control" required>
                                <option value="">Selecione o status</option>
                            </select>
                        </div>
                        <div class="acoes-form-actions">
                            <button type="button" class="btn btn-secondary" onclick="app.fecharFormNovaAcao()">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="btn-salvar-acao-detalhe">Registrar Ação</button>
                        </div>
                    </form>
                </div>

                <!-- Tabela de Ações -->
                <div class="table-container acoes-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Descrição da Ação</th>
                                <th>Servidor Responsável</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="detalhe-acoes-tbody">
                            <!-- Linhas injetadas via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- View: Kanban -->
    <template id="view-kanban">
        <div class="kanban-board" id="kanbanBoard">
            <!-- Colunas injetadas via JS -->
        </div>
    </template>

    <!-- View: Calendário -->
    <template id="view-calendario">
        <div id="calendar-container"></div>
    </template>

    <!-- View: Cadastros -->
    <template id="view-cadastros">
        <div class="cadastros-layout">
            <div class="cadastros-menu">
                <ul id="cadastros-tabs">
                    <li class="active" data-table="escolas">Escolas</li>
                    <li data-table="coordenadorias">Coordenações</li>
                    <li data-table="funcionarios">Funcionários</li>
                    <li data-table="demandantes">Demandantes</li>
                    <li data-table="setores">Setores</li>
                    <li data-table="tipos_demanda">Tipos de Demanda</li>
                    <li data-table="status_atendimento">Status Atendimento</li>
                </ul>
            </div>
            <div class="cadastros-content">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="app.openModalCadastro()"><i class="ri-add-line"></i> Novo Registro</button>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead id="cadastro-thead"></thead>
                        <tbody id="cadastro-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- View: Usuários (ADM) -->
    <template id="view-usuarios">
        <div class="toolbar">
            <button class="btn btn-primary" onclick="app.openModalUsuario()"><i class="ri-user-add-line"></i> Novo Usuário</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Login</th>
                        <th>Perfil</th>
                        <th>Permissões Extras</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="usuarios-tbody"></tbody>
            </table>
        </div>
    </template>

    <!-- View: Contatos -->
    <template id="view-contatos">
        <div class="toolbar">
            <div class="filters">
                <input type="text" id="filter-contatos-search" placeholder="Buscar contatos..." oninput="app.filtrarContatos()">
            </div>
            <button class="btn btn-primary" onclick="app.openModalContato()"><i class="ri-user-add-line"></i> Novo Contato</button>
        </div>
        <div id="contatos-grid" class="contatos-grid">
            <!-- Cartões injetados via JS -->
        </div>
    </template>

    <!-- View: Agenda de Demandas (Lista de Agendas) -->
    <template id="view-agenda_demandas">
        <div class="toolbar">
            <div class="filters">
                <input type="text" id="filter-agendas-search" placeholder="Buscar agenda..." oninput="app.carregarAgendas()">
            </div>
            <button class="btn btn-primary" onclick="app.openModalNovaAgenda()"><i class="ri-add-line"></i> Nova Agenda</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Responsável SEDE</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="agendas-tbody">
                    <!-- Linhas injetadas via JS -->
                </tbody>
            </table>
        </div>
    </template>

    <!-- View: Itens da Agenda de Demandas -->
    <template id="view-agenda_demandas_itens">
        <div class="demanda-detalhe-container">
            <div class="demanda-detalhe-header">
                <button class="btn btn-voltar" onclick="app.loadView('agenda_demandas')"><i class="ri-arrow-left-line"></i> Voltar às Agendas</button>
                <div class="demanda-detalhe-actions">
                    <button class="btn btn-primary" onclick="app.openModalNovoItemAgenda()"><i class="ri-add-line"></i> Novo Item</button>
                    <button class="btn btn-secondary" onclick="app.imprimirAgenda()"><i class="ri-printer-line"></i> Imprimir / PDF</button>
                </div>
            </div>

            <!-- Dados da Agenda -->
            <div class="card detalhe-card" style="margin-bottom: 20px;">
                <h2 class="detalhe-titulo" id="agenda-titulo-display">-</h2>
                <div class="detalhe-grid">
                    <div class="detalhe-item">
                        <label>Data</label>
                        <span id="agenda-data-display">-</span>
                    </div>
                    <div class="detalhe-item">
                        <label>Responsável SEDE</label>
                        <span id="agenda-responsavel-display">-</span>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Data Inicial</th>
                            <th>Descrição da Demanda</th>
